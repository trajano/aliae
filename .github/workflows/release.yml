name: Release

on:
  push:
    paths:
      - 'src/**'
      - 'packages/**'
      - '.github/workflows/**'

jobs:
  changelog:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      body: ${{ steps.changelog.outputs.clean_changelog }}
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Create changelog ✍️
        id: changelog
        uses: TriPSs/conventional-changelog-action@67139193614f5b9e8db87da1bd4240922b34d765
        with:
          github-token: ${{ secrets.github_token }}
          skip-version-file: "true"
          output-file: "false"
          skip-commit: "true"
          skip-on-empty: "true"
  artifacts:
    needs: changelog
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}/src
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install Go 🗳
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.7'
      - name: Tag HEAD 😸
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.changelog.outputs.tag }}
      - name: Run GoReleaser 🚀
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          distribution: goreleaser
          version: latest
          args: build --clean
          workdir: src
      - name: Release 🎓
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          files: |
            src/dist/aliae-*
      - name: Dispatch Scoop bucket update
        env:
          DISPATCH_TOKEN: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISPATCH_TOKEN)) {
            throw "Missing secret REPOSITORY_DISPATCH_TOKEN"
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:DISPATCH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{
            event_type = "aliae_release_published"
            client_payload = @{
              source_repository = "${{ github.repository }}"
              release_tag = "${{ needs.changelog.outputs.tag }}"
              release_version = "${{ needs.changelog.outputs.version }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/trajano/scoop-bucket/dispatches" `
            -Headers $headers `
            -Body $body
      - name: Dispatch Homebrew tap update
        env:
          DISPATCH_TOKEN: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISPATCH_TOKEN)) {
            throw "Missing secret REPOSITORY_DISPATCH_TOKEN"
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:DISPATCH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{
            event_type = "aliae_release_published"
            client_payload = @{
              source_repository = "${{ github.repository }}"
              release_tag = "${{ needs.changelog.outputs.tag }}"
              release_version = "${{ needs.changelog.outputs.version }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/trajano/homebrew-tap/dispatches" `
            -Headers $headers `
            -Body $body
