name: Release

on:
  push:
    paths:
      - 'src/**'
      - 'packages/**'
      - '.github/workflows/**'

jobs:
  changelog:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      body: ${{ steps.changelog.outputs.clean_changelog }}
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@v6
      - name: Create changelog ✍️
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.github_token }}
          skip-version-file: "true"
          output-file: "false"
          skip-commit: "true"
          skip-on-empty: "true"
  artifacts:
    needs: changelog
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}/src
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@v6
      - name: Install Go 🗳
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
      - name: Tag HEAD 😸
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.changelog.outputs.tag }}
      - name: Run GoReleaser 🚀
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --clean
          workdir: src
      - name: Release 🎓
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          files: |
            src/dist/aliae-*
      - name: Dispatch Scoop bucket update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          repository: trajano/scoop-bucket
          event-type: aliae_release_published
          client-payload: >-
            {"source_repository":"${{ github.repository }}","release_tag":"${{
            needs.changelog.outputs.tag }}","release_version":"${{
            needs.changelog.outputs.version }}"}
      - name: Dispatch Homebrew tap update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
          repository: trajano/homebrew-tap
          event-type: aliae_release_published
          client-payload: >-
            {"source_repository":"${{ github.repository }}","release_tag":"${{
            needs.changelog.outputs.tag }}","release_version":"${{
            needs.changelog.outputs.version }}"}
